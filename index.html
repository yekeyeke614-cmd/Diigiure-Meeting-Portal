<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0F10">
<title>Diigiure Meeting Portal</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#0F0F10;--paper:#FFFFFF;--violet:#7C5CFC;--violet-d:#6845ee;--mute:#a8a6b3;--line:rgba(255,255,255,.12);--ok:#3ecf8e;--warn:#f0b429;--err:#ff6b6b;
--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:max(20px,env(safe-area-inset-top)) clamp(20px,5vw,64px) max(20px,env(safe-area-inset-bottom));position:relative;isolation:isolate}
header{display:flex;justify-content:space-between;align-items:center;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.2px}
.brand img{height:44px;width:auto}
.tools{display:flex;gap:10px}
.chip{font:inherit;font-size:.85rem;color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--violet);background:rgba(124,92,252,.12)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,6vw,96px);align-items:center;padding-block:clamp(24px,6vh,64px)}
.intro h1{font-size:clamp(2.2rem,5.4vw,4.2rem);line-height:1.15;font-weight:700;letter-spacing:-.01em;margin-bottom:20px}
.intro p{color:var(--mute);font-size:1.08rem;max-width:34em}
.portal{position:absolute;inset-inline-start:-8vw;top:50%;width:min(60vw,640px);aspect-ratio:1;transform:translateY(-50%);z-index:-1;opacity:.9;pointer-events:none}
.portal circle{fill:none;stroke:var(--violet);transform-origin:50% 50%}
.portal .r1{stroke-width:1.2;opacity:.55}.portal .r2{stroke-width:1;opacity:.3}.portal .r3{stroke-width:1;opacity:.16}
.portal .arc{stroke-width:3;stroke-linecap:round;stroke-dasharray:90 400;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:clamp(24px,3.4vw,40px);box-shadow:0 30px 80px -30px rgba(124,92,252,.55)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:500;margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(62,207,142,.2)}
.warn .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(240,180,41,.22)}
.bad .dot{background:var(--err);box-shadow:0 0 0 4px rgba(255,107,107,.2)}
.card h2{font-size:1.5rem;line-height:1.35;margin-bottom:6px}
.when{color:#5a5866;font-size:.95rem;margin-bottom:22px;min-height:1.4em}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;font:inherit;font-size:1.15rem;font-weight:600;color:#fff;background:var(--violet);border:0;border-radius:14px;text-decoration:none;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:var(--violet-d)}.btn:active{transform:scale(.985)}
.btn[aria-disabled=true]{background:#d9d7e3;color:#6b6877;pointer-events:none}
.btn svg{width:20px;height:20px}[dir=rtl] .btn svg{transform:scaleX(-1)}
.help{margin-top:22px;padding-top:18px;border-top:1px solid #ebeaf1;font-size:.9rem;color:#4b4958}
.help ul{padding-inline-start:1.2em;margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ghost{font:inherit;font-size:.85rem;color:var(--ink);background:#f3f1fb;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none}
.ghost:hover{background:#e7e2fb}
footer{color:var(--mute);font-size:.82rem;padding-block:10px}
.overlay{position:fixed;inset:0;background:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:10;text-align:center;padding:24px}
.overlay.on{display:flex}
.loadbox{position:relative;width:140px;height:140px;display:grid;place-items:center}.loadbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}.loadbox.vid video{opacity:1}.loadbox.vid .spin{display:none}
.spin{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--violet);animation:spin .9s linear infinite}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.card :focus-visible{outline-color:var(--ink)}
@media (max-width:820px){main{grid-template-columns:1fr}.portal{width:110vw;inset-inline-start:-30vw;top:22%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <svg class="portal" viewBox="0 0 400 400" aria-hidden="true"><circle class="r1" cx="200" cy="200" r="190"/><circle class="r2" cx="200" cy="200" r="150"/><circle class="r3" cx="200" cy="200" r="110"/><circle class="arc" cx="200" cy="200" r="190"/></svg>
  <header>
    <div class="brand">
      <img src="assets/logo.png" alt="" width="34" height="48"><span>Diigiure</span>
    </div>
    <div class="tools"><button class="chip" id="lang" type="button">English</button></div>
  </header>

  <main>
    <section class="intro">
      <h1 id="h1"></h1>
      <p id="lead"></p>
    </section>
    <section class="card" id="card" aria-live="polite">
      <div class="status" id="status"><span class="dot"></span><span id="stxt"></span></div>
      <h2 id="mtitle"></h2>
      <div class="when" id="when"></div>
      <a class="btn" id="join" href="#" rel="noopener noreferrer">
        <span id="jtxt"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <div class="help" id="help"></div>
      <div class="links">
        <button class="ghost" id="copy" type="button"></button>
        <a class="ghost" id="mail" href="#" hidden></a>
      </div>
    </section>
  </main>

  <footer id="foot"></footer>
</div>

<div class="overlay" id="ov" role="status"><div class="loadbox"><div class="spin" id="spin"></div><video id="lv" muted loop playsinline preload="none" aria-hidden="true"><source src="assets/loader.webm" type="video/webm"></video></div><div id="ovt"></div></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var T={
ar:{dir:"rtl",toggle:"English",h1:"مرحبًا بك في Diigiure.",lead:"هذا هو المدخل الرسمي لاجتماعاتنا الرقمية. اضغط على الزر أدناه وستنضم مباشرة إلى اجتماعك، بيئة سهلة وآمنة وبدون إنشاء حساب.",
ready:"البوابة جاهزة",meet:"اجتماعك مع Diigiure",join:"الانتقال إلى الاجتماع",
help:"<strong>قبل الانضمام</strong><ul><li>يفتح الاجتماع في المتصفح، ولا حاجة لتثبيت تطبيق في أغلب الحالات.</li><li>اسمح باستخدام الميكروفون والكاميرا عندما يطلب المتصفح ذلك.</li></ul>",
copy:"نسخ رابط البوابة",copied:"تم النسخ",mail:"التواصل مع Diigiure",
go:"جارٍ تحويلك إلى غرفة الاجتماع…",
nc_s:"الاجتماع غير مُعدّ بعد",nc_t:"لم يُحدَّد رابط الاجتماع بعد",nc_h:"لا يوجد رابط اجتماع مفعّل الآن. تواصل مع مُرسل الدعوة للحصول على رابط جديد.",
iv_s:"رابط غير صالح",iv_t:"لم نجد هذا الاجتماع",iv_h:"الرابط الذي فتحته غير مكتمل أو غير صحيح. اطلب من مُرسل الدعوة رابطًا جديدًا.",
ex_s:"انتهت صلاحية الرابط",ex_t:"انتهى هذا الاجتماع",ex_h:"انتهت صلاحية رابط هذا الاجتماع. اطلب من مُرسل الدعوة رابطًا محدّثًا.",
bad_h:"رابط الاجتماع المضبوط غير آمن أو غير صحيح. أبلغ مُرسل الدعوة.",
foot:"© Diigiure. المدخل الرسمي للاجتماعات الرقمية.",locale:"ar"},
en:{dir:"ltr",toggle:"العربية",h1:"Welcome to Diigiure.",lead:"This is the official entrance to our digital meetings. Press the button below to join your meeting directly: simple, secure, and no account needed.",
ready:"Portal ready",meet:"Your meeting with Diigiure",join:"Go to the meeting",
help:"<strong>Before you join</strong><ul><li>The meeting opens in your browser. In most cases no app is required.</li><li>Allow microphone and camera access when your browser asks.</li></ul>",
copy:"Copy portal link",copied:"Copied",mail:"Contact Diigiure",
go:"Taking you to the meeting room…",
nc_s:"Meeting not set up yet",nc_t:"No meeting link is set yet",nc_h:"There is no active meeting link right now. Ask whoever invited you for a new link.",
iv_s:"Invalid link",iv_t:"We couldn't find this meeting",iv_h:"The link you opened is incomplete or incorrect. Ask whoever invited you for a new one.",
ex_s:"Link expired",ex_t:"This meeting has ended",ex_h:"This meeting link has expired. Ask whoever invited you for an updated link.",
bad_h:"The configured meeting link is unsafe or malformed. Please tell whoever invited you.",
foot:"© Diigiure. The official entrance to digital meetings.",locale:"en"}
};
var cfg=window.DIIGIURE_CONFIG||{meetings:{}};
var $=function(i){return document.getElementById(i)};
var lang=(localStorage.getItem("dg-lang")||(/^ar/i.test(navigator.language)?"ar":"ar"));
try{lang=localStorage.getItem("dg-lang")||"ar"}catch(e){}

function pickRef(){
  var q=new URLSearchParams(location.search).get("m");
  var h=location.hash.replace(/^#/,"");
  var r=q||h||cfg.defaultMeeting||"";
  return {ref:r,explicit:!!(q||h)};
}
function safeUrl(u){
  try{var x=new URL(u);return x.protocol==="https:"?x.href:null}catch(e){return null}
}
function resolve(){
  var p=pickRef();
  if(!/^[A-Za-z0-9_-]{1,64}$/.test(p.ref)) return {state:"invalid"};
  var m=Object.prototype.hasOwnProperty.call(cfg.meetings||{},p.ref)?cfg.meetings[p.ref]:null;
  if(!m) return {state:"invalid"};
  if(!m.url) return {state:"notconfigured",m:m};
  if(m.expires&&Date.now()>Date.parse(m.expires)) return {state:"expired",m:m};
  var u=safeUrl(m.url);
  if(!u) return {state:"malformed",m:m};
  return {state:"ready",m:m,url:u};
}
function fmt(iso,t){
  var d=new Date(iso); if(isNaN(d)) return "";
  try{return new Intl.DateTimeFormat(t.locale,{dateStyle:"full",timeStyle:"short"}).format(d)}catch(e){return d.toString()}
}
function render(){
  var t=T[lang],r=resolve(),card=$("card"),j=$("join");
  document.documentElement.lang=lang;document.documentElement.dir=t.dir;
  $("lang").textContent=t.toggle;$("h1").textContent=t.h1;$("lead").textContent=t.lead;
  $("jtxt").textContent=t.join;$("copy").textContent=t.copy;$("mail").textContent=t.mail;
  $("foot").textContent=t.foot;$("ovt").textContent=t.go;
  document.title="Diigiure Meeting Portal";
  card.className="card";$("help").innerHTML=t.help;$("when").textContent="";
  var st=r.state,m=r.m||{};
  if(st==="ready"){
    $("stxt").textContent=t.ready;$("mtitle").textContent=m.title||t.meet;
    $("when").textContent=m.startsAt?fmt(m.startsAt,t):"";
    j.href=r.url;j.removeAttribute("aria-disabled");j.tabIndex=0;
  }else{
    var k={invalid:"iv",notconfigured:"nc",expired:"ex",malformed:"nc"}[st];
    card.classList.add(st==="invalid"||st==="malformed"?"bad":"warn");
    $("stxt").textContent=t[k+"_s"];$("mtitle").textContent=t[k+"_t"];
    $("help").textContent=st==="malformed"?t.bad_h:t[k+"_h"];
    j.removeAttribute("href");j.setAttribute("aria-disabled","true");j.tabIndex=-1;
  }
  var mail=$("mail");
  if(cfg.contactEmail){mail.hidden=false;mail.href="mailto:"+cfg.contactEmail}else mail.hidden=true;
}
$("lang").onclick=function(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("dg-lang",lang)}catch(e){}render()};
$("join").addEventListener("click",function(e){
  var h=this.getAttribute("href");
  if(!h||this.getAttribute("aria-disabled")==="true"){e.preventDefault();return}
  e.preventDefault();$("ov").classList.add("on");var v=$("lv");try{v.addEventListener("playing",function(){v.parentNode.classList.add("vid")},{once:true});var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}catch(x){}
  setTimeout(function(){location.assign(h)},1200);
});
window.addEventListener("pageshow",function(){$("ov").classList.remove("on")});
$("copy").onclick=function(){
  var b=this,t=T[lang],done=function(){var o=b.textContent;b.textContent=t.copied;setTimeout(function(){b.textContent=T[lang].copy},1600)};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(location.href).then(done,function(){});
  else{var i=document.createElement("input");i.value=location.href;document.body.appendChild(i);i.select();try{document.execCommand("copy");done()}catch(e){}i.remove()}
};
window.addEventListener("hashchange",render);
render();
})();
</script>
</body>
</html>
